baseURL = "https://vanthuonghi.github.io/hieubietcrypto/"
languageCode = "vi-VN"
title = "Hiểu Biết Crypto"
theme = "PaperMod"
defaultContentLanguage = "vi"
paginate = 10
enableEmoji = true

[menu]
  [[menu.main]]
    identifier = "home"
    name = "Trang chủ"
    url = "/"
    weight = 1
  [[menu.main]]
    identifier = "posts"
    name = "Bài viết"
    url = "/posts/"
    weight = 2
  [[menu.main]]
    identifier = "categories"
    name = "Danh mục"
    url = "/categories/"
    weight = 3
  [[menu.main]]
    identifier = "about"
    name = "Giới thiệu"
    url = "/about/"
    weight = 4

[params]
  description = "Hiểu Biết Crypto - Kiến thức Crypto an toàn, khách quan cho người mới bắt đầu. Tin tức thị trường, cảnh báo scam, kiến thức nền tảng."
  env = "production"
  author = "Hiểu Biết Crypto"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  comments = false

  [params.homeInfoParams]
    Title = "Chào mừng đến với Hiểu Biết Crypto 🚀"
    Content = "Kênh kiến thức Crypto **an toàn, khách quan** dành cho người mới bắt đầu.\n\n📰 Tin tức thị trường mới nhất\n📚 Kiến thức nền tảng dễ hiểu\n⚠️ Cảnh báo scam & rủi ro\n🔍 Phân tích khách quan 2 chiều"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/vanthuonghi/hieubietcrypto"
  [[params.socialIcons]]
    name = "facebook"
    url = "https://facebook.com/hieubietcrypto"

  [params.assets]
    disableHLJS = true

[taxonomies]
  category = "categories"
  tag = "tags"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = "dracula"
